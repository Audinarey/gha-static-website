name: Nice if example
on: 
  push:
    branches:
      - main
      - develop
      - feature/**
jobs: 
  quality_checks:
    # this command needs devs to prefix their feature branches with feature branch name
    if: startsWith(github.ref_name, 'feature') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: perform code quality checks
        run: echo "Performing code quality checks"
    
  dev_deploy:
    if: github.ref_name == 'develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dev dev_deploy
        run: echo "Deploying the code to development environment"

  prod-deploy:
    if: github.ref_name == 'main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Prod Deploying
        run: echo "Deploying the code to Production Environment"

  # notification parts
  success-notify:
    needs: [quality_checks, dev_deploy, prod-deploy]
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify success
        run: echo "Success email sent to the team"

  failure-notify:
    needs: [quality_checks, dev_deploy, prod-deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify success
        run: echo "Success email sent to the team"